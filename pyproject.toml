[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "veripy"
# Alpha marker manages expectations; it does not gate installation.
# The PyPI name `veripy` is already taken by an unrelated 2016 project, so
# a later publish will need a distinct distribution name or a transfer.
version = "0.1.0a1"
description = "Verify a typed Python fragment: #@ specs compile to runtime contracts and translate to Dafny for SMT proofs."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["verification", "dafny", "contracts", "smt", "formal-methods", "crosshair"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "icontract>=2.6.6",
]

[project.urls]
Homepage = "https://github.com/nolanlwin/veripy"
Repository = "https://github.com/nolanlwin/veripy"
Issues = "https://github.com/nolanlwin/veripy/issues"

[project.optional-dependencies]
types = [
    "basedpyright>=1.39",
]
dev = [
    "pytest>=8",
    "crosshair-tool>=0.0.70",
    "basedpyright>=1.39",
    "hypothesis>=6",
    "DafnyRuntimePython>=4.11",
]

[project.scripts]
veripy = "veripy.cli:main"

[tool.setuptools.packages.find]
include = ["veripy*"]
