[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lemmapy"
version = "0.0.1"
description = "Verify annotated production Python: #@ specs on real code, runtime contracts today (M0), typed-fragment translation to Dafny next (M1)."
requires-python = ">=3.11"
dependencies = [
    "icontract>=2.6.6",
]
# NOTE: no license declared yet — deliberately all-rights-reserved while the
# project home (Astrio / MidSpiral / Metareflection) is being settled.

[project.optional-dependencies]
types = [
    "basedpyright>=1.39",
]
dev = [
    "pytest>=8",
    "crosshair-tool>=0.0.70",
    "basedpyright>=1.39",
    "hypothesis>=6",
    "DafnyRuntimePython>=4.11",
]

[project.scripts]
lemmapy = "lemmapy.cli:main"

[tool.setuptools.packages.find]
include = ["lemmapy*"]
