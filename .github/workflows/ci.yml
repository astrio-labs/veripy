# LemmaPy CI: the differential harness and full suite run on every PR
# (an M1 exit criterion). Two tiers so the fast signal is never blocked
# on the prover install.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Tier 1 — no Dafny: parser, encoder, guards, benchmark mechanics,
  # conformance. Dafny-dependent tests skip themselves (find_dafny gate).
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests (Dafny-dependent tests self-skip)
        run: python -m pytest tests/ -q

  # Tier 2 — full pipeline: Dafny proofs + the translation-validation
  # harness (difftest) over the corpus.
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Install Dafny
        run: |
          dotnet tool install --global dafny
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Full suite (proofs + difftest)
        run: python -m pytest tests/ -q
      - name: Benchmark scorecard (quick tier)
        run: lemmapy benchmark --quick
